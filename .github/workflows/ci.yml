name: CI — Lint, Type Check, Test & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Run the prediction tests in two timezones: date bugs only show up
      # away from UTC (e.g. Nairobi is UTC+3).
      - name: Unit tests (UTC)
        run: npm test
        env:
          TZ: UTC
      - name: Unit tests (Africa/Nairobi)
        run: npm test
        env:
          TZ: Africa/Nairobi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
